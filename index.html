<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NARKA 광고 성과 대시보드</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Malgun Gothic','Apple SD Gothic Neo',sans-serif;background:#F8F3DA;color:#2C2C2C;min-height:100vh}

/* ── 로그인 화면 ── */
.login-screen{display:flex;align-items:center;justify-content:center;min-height:100vh;background:#2C2C2C}
.login-card{background:#fff;border-radius:16px;padding:48px 40px;text-align:center;width:360px;box-shadow:0 8px 40px rgba(0,0,0,0.3)}
.login-logo{font-size:28px;font-weight:700;color:#2C2C2C;letter-spacing:3px;margin-bottom:4px}
.login-sub{font-size:12px;color:#aaa;margin-bottom:32px}
.login-title{font-size:15px;font-weight:600;color:#2C2C2C;margin-bottom:8px}
.login-desc{font-size:11px;color:#aaa;margin-bottom:28px;line-height:1.5}
.google-btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:12px;border:1.5px solid #E0E0E0;border-radius:8px;background:#fff;cursor:pointer;font-family:inherit;font-size:13px;font-weight:600;color:#2C2C2C;transition:all .15s}
.google-btn:hover{border-color:#B8860B;background:#FFFAE8}
.google-icon{width:18px;height:18px}
.login-error{font-size:11px;color:#8B1A1A;background:#FEE;padding:8px 12px;border-radius:6px;margin-top:16px;display:none}

/* ── 상단바 ── */
.topbar{background:#2C2C2C;padding:12px 24px;display:flex;align-items:center;gap:12px}
.logo{font-size:16px;font-weight:700;color:#FFEEA2;letter-spacing:2px}
.topbar-right{margin-left:auto;display:flex;align-items:center;gap:12px}
.user-info{font-size:11px;color:#aaa}
.user-name{color:#FFEEA2;font-weight:600}
.logout-btn{font-size:11px;color:#888;background:none;border:1px solid #444;border-radius:4px;padding:3px 8px;cursor:pointer;font-family:inherit}
.logout-btn:hover{border-color:#FFEEA2;color:#FFEEA2}

/* ── 채널 탭 ── */
.channel-tabs{display:flex;background:#1E1E1E;padding:0 24px}
.ch-tab{padding:12px 24px;font-size:12px;font-weight:700;cursor:pointer;color:#666;border-bottom:3px solid transparent;transition:all .15s;letter-spacing:.5px}
.ch-tab.active{color:#FFEEA2;border-bottom-color:#FFEEA2}
.ch-tab:hover:not(.active){color:#aaa}

/* ── 기간 탭 ── */
.tabs{display:flex;padding:0 20px;border-bottom:1.5px solid #E0D8A8;margin-top:4px;background:#F8F3DA}
.tab{padding:10px 20px;font-size:12px;font-weight:600;cursor:pointer;border-bottom:2.5px solid transparent;color:#888;transition:all .15s}
.tab.active{color:#2C2C2C;border-bottom-color:#B8860B}
.tab:hover:not(.active){color:#555}

/* ── 날짜 범위 바 ── */
.date-range-bar{display:flex;align-items:center;gap:8px;padding:10px 20px;background:#FFFCF0;border-bottom:1px solid #E8DEB4;flex-wrap:wrap}
.dr-label{font-size:11px;color:#888;font-weight:600}
.dr-input{font-family:inherit;font-size:11px;padding:5px 8px;border:1.5px solid #E0D8A8;border-radius:6px;color:#2C2C2C;background:#fff}
.dr-input:focus{outline:none;border-color:#B8860B}
.dr-sep{color:#aaa;font-size:11px}
.dr-reset{font-family:inherit;font-size:11px;font-weight:600;padding:5px 12px;border-radius:6px;border:1.5px solid #E0D8A8;background:#fff;color:#888;cursor:pointer}
.dr-reset:hover{border-color:#B8860B;color:#2C2C2C}
.dr-info{font-size:10px;color:#C05E1A;margin-left:4px}

/* ── 업로드 존 ── */
.upload-zone{margin:16px 20px;border:2px dashed #C8B866;border-radius:12px;background:#FFFCF0;padding:20px;text-align:center}
.upload-zone h3{font-size:13px;color:#2C2C2C;margin-bottom:4px}
.upload-zone p{font-size:11px;color:#aaa;margin-bottom:14px}
.upload-row{display:flex;gap:16px;justify-content:center;flex-wrap:wrap}
.upload-item{text-align:center}
.upload-btn{display:inline-flex;align-items:center;gap:6px;background:#2C2C2C;color:#FFEEA2;border:none;border-radius:8px;padding:8px 16px;font-size:12px;cursor:pointer;font-family:inherit;font-weight:600}
.upload-btn:hover{background:#444}
.file-input{display:none}
.file-status{font-size:11px;margin-top:5px;padding:3px 8px;border-radius:4px;display:inline-block}
.st-wait{color:#888;background:#F0F0F0}
.st-ok{color:#2D6A4F;background:#EEF7EE}
.st-err{color:#8B1A1A;background:#FEEAEA}
.st-load{color:#1A3A7A;background:#EEF3FA}

/* ── 자동저장 상태 ── */
.save-bar{display:flex;align-items:center;gap:8px;padding:6px 20px;background:#EEF7EE;border-bottom:1px solid #C8E6C9;font-size:11px;color:#2D6A4F}
.save-bar.hidden{display:none}

/* ── KPI ── */
.kpi-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;padding:16px 20px 0}
.kpi{background:#fff;border-radius:10px;padding:13px 15px;border:1px solid #E8DEB4}
.kpi-label{font-size:10px;color:#aaa;margin-bottom:5px;text-transform:uppercase;letter-spacing:.4px}
.kpi-val{font-size:20px;font-weight:700;color:#2C2C2C;line-height:1.1}
.kpi-val.kpi-full{font-size:16px;letter-spacing:-0.3px;word-break:break-all}
.basis-note{font-size:10px;color:#9a8f6a;background:#FBF7E6;border-left:3px solid #E8DEB4;padding:5px 8px;border-radius:3px;margin:4px 0 8px;line-height:1.45}
.chart-caption{font-size:11px;color:#999;text-align:center;margin-top:6px}
.kpi-val.kpi-full small{font-size:11px;color:#aaa;font-weight:600;margin-left:2px}
.kpi-sub{font-size:10px;margin-top:4px}
.c-up{color:#2D6A4F}.c-dn{color:#8B1A1A}.c-neu{color:#888}

/* ── 섹션 ── */
.section{padding:14px 20px}
.sec-title{font-size:11px;font-weight:700;color:#888;text-transform:uppercase;letter-spacing:1px;margin-bottom:10px;display:flex;align-items:center;gap:6px}
.sec-title b{display:inline-block;width:3px;height:12px;background:#B8860B;border-radius:2px}
.sec-label{font-size:10px;color:#aaa;font-weight:400;margin-left:4px;text-transform:none;letter-spacing:0}

/* ── 차트 ── */
.chart-grid-2{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px}
.chart-card{background:#fff;border-radius:10px;border:1px solid #E8DEB4;padding:16px;display:flex;flex-direction:column}
.chart-wrap,.chart-wrap-tall{margin-top:auto}
.chart-card h4{font-size:12px;color:#2C2C2C;font-weight:700;line-height:1.4;margin-bottom:4px}
.chart-card .chart-sub{font-size:10px;color:#aaa;margin-bottom:10px}
.chart-note{font-size:10px;color:#C05E1A;margin-bottom:8px;font-style:italic}
.chart-wrap{position:relative;height:180px;flex-shrink:0}
.chart-wrap-tall{position:relative;height:210px;flex-shrink:0}

.prod-filter{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px;min-height:28px}
.pfil{padding:3px 10px;border-radius:20px;font-size:11px;font-weight:600;cursor:pointer;border:1.5px solid #E0D8A8;background:#fff;color:#888;transition:all .15s;font-family:inherit;white-space:nowrap}
.pfil.active{background:#2C2C2C;color:#FFEEA2;border-color:#2C2C2C}
.pfil:hover:not(.active){border-color:#B8860B;color:#2C2C2C}

.ch-toggle{display:flex;gap:6px;margin-bottom:10px}
.ctgl{padding:4px 12px;border-radius:6px;font-size:11px;font-weight:600;cursor:pointer;border:1.5px solid #E0D8A8;background:#fff;color:#888;transition:all .15s;font-family:inherit}
.media-chk{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;color:#555;cursor:pointer;margin-right:14px}
.media-chk input{cursor:pointer}
.issue-panel{margin-top:14px;padding-top:12px;border-top:1px dashed #E8DEB4}
.issue-panel-title{font-size:11px;font-weight:700;color:#888;margin-bottom:8px}
.issue-form{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:8px}
.issue-input{border:1px solid #E0D8A8;border-radius:6px;padding:5px 8px;font-size:11px;font-family:inherit}
.issue-text{flex:1;min-width:160px}
.issue-link{width:140px}
.issue-add-btn{background:#B8860B;color:#fff;border:none;border-radius:6px;padding:5px 14px;font-size:11px;font-weight:700;cursor:pointer}
.issue-add-btn:hover{background:#9c7209}
.issue-list{display:flex;flex-direction:column;gap:6px}
.issue-item{display:flex;align-items:center;gap:8px;font-size:11px;background:#FBF7E6;border-radius:6px;padding:6px 10px}
.issue-item .issue-date{color:#B8860B;font-weight:700;white-space:nowrap}
.issue-item .issue-body{flex:1;color:#555}
.issue-item a{color:#2a78d6;text-decoration:none}
.issue-item a:hover{text-decoration:underline}
.issue-del{cursor:pointer;color:#aaa;font-weight:700;padding:0 4px}
.issue-del:hover{color:#8B1A1A}
.ctgl.active{background:#1A3A5C;color:#fff;border-color:#1A3A5C}

.legend{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:8px}
.lg-item{display:flex;align-items:center;gap:5px;font-size:10px;color:#888}
.lg-sq{width:10px;height:10px;border-radius:2px;flex-shrink:0}
.lg-line{width:16px;height:2px;flex-shrink:0;border-radius:1px}

/* ── 통합 탭 특별 스타일 ── */
.integrated-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;padding:16px 20px}
.channel-summary{background:#fff;border-radius:12px;border:1px solid #E8DEB4;overflow:hidden}
.channel-summary-header{padding:14px 16px;display:flex;align-items:center;gap:8px;border-bottom:1px solid #E8DEB4}
.channel-badge{font-size:10px;font-weight:700;padding:2px 8px;border-radius:4px}
.badge-oy{background:#FFEEA2;color:#8B6914}
.badge-js{background:#D4EDDA;color:#1A5C2A}
.channel-summary h3{font-size:13px;font-weight:700;color:#2C2C2C}
.channel-summary-body{padding:14px 16px}
.summary-kpi-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.summary-kpi{background:#F8F3DA;border-radius:8px;padding:10px 12px}
.summary-kpi-label{font-size:10px;color:#888;margin-bottom:3px}
.summary-kpi-val{font-size:16px;font-weight:700;color:#2C2C2C}
.summary-kpi-val.sk-full{font-size:14px;letter-spacing:-0.3px;word-break:break-all}
.summary-kpi-val.sk-full small{font-size:10px;color:#aaa;font-weight:600;margin-left:2px}
.summary-kpi-sub{font-size:10px;color:#aaa;margin-top:2px}
.summary-chart-wrap{height:140px;position:relative}

/* ── 수익성 섹션 ── */
.profit-section{padding:16px 20px}
.profit-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:16px}
.profit-card{background:#fff;border-radius:10px;border:1px solid #E8DEB4;padding:16px}
.profit-card h4{font-size:11px;font-weight:700;color:#888;margin-bottom:12px;text-transform:uppercase;letter-spacing:.5px}
.profit-row{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:.5px solid #F0E8C0;font-size:11px}
.profit-row:last-child{border:none}
.profit-label{color:#888}
.profit-val{font-weight:600;color:#2C2C2C}
.profit-total{background:#2C2C2C;border-radius:8px;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;margin-top:12px}
.profit-total-label{font-size:12px;color:#FFEEA2;font-weight:700}
.profit-total-val{font-size:20px;font-weight:700;color:#FFEEA2}

.cost-input{display:flex;flex-direction:column;gap:8px;margin-top:8px}
.cost-row{display:flex;align-items:center;gap:8px;font-size:11px}
.cost-row label{color:#888;width:100px;flex-shrink:0}
.cost-row input{flex:1;padding:4px 8px;border:1.5px solid #E0D8A8;border-radius:4px;font-family:inherit;font-size:11px}
.cost-row input:focus{outline:none;border-color:#B8860B}
.cost-row span{color:#aaa;font-size:10px;width:30px}

/* ── 테이블 ── */
.tbl-wrap{background:#fff;border-radius:10px;border:1px solid #E8DEB4;overflow:auto;max-height:360px}
table{width:100%;border-collapse:collapse;font-size:11px}
thead th{background:#F8F3DA;padding:7px 10px;text-align:right;font-weight:600;color:#5C5C5C;border-bottom:1px solid #E0D8A8;white-space:nowrap;position:sticky;top:0;z-index:1}
thead th:first-child{text-align:left}
thead tr.sh th{background:#F0E8B0;font-size:10px;color:#8B6914;text-align:center}
tbody tr:nth-child(even){background:#FDFBF0}
tbody tr:hover{background:#FFFAE0}
tbody td{padding:6px 10px;text-align:right;border-bottom:.5px solid #EEE8CC;color:#2C2C2C}
tbody td:first-child{text-align:left;color:#5C5C5C;font-weight:600}
.hi{color:#2D6A4F;font-weight:700}.mid{color:#C05E1A;font-weight:700}.lo{color:#8B1A1A;font-weight:700}

.debug-toggle{margin:0 20px 0;display:flex;align-items:center;gap:8px;cursor:pointer;user-select:none}
.debug-toggle span{font-size:11px;color:#aaa}
.debug-arrow{font-size:10px;color:#aaa}
.debug-panel{margin:6px 20px 12px;background:#fff;border:1px solid #E0D8A8;border-radius:8px;padding:12px;font-size:11px;display:none}
.debug-panel.open{display:block}
.debug-grid{display:grid;grid-template-columns:auto 1fr;gap:3px 12px}
.dl{color:#aaa;white-space:nowrap;padding:2px 0}
.dv{font-family:monospace;padding:2px 0;word-break:break-all}
.dok{color:#2D6A4F}.dwarn{color:#C05E1A}.derr{color:#8B1A1A}

.empty{text-align:center;padding:50px 20px}
.empty h3{font-size:14px;color:#888;margin-bottom:6px}
.empty p{font-size:12px;color:#aaa}

.hidden{display:none!important}

@media(max-width:680px){
  .chart-grid-2{grid-template-columns:1fr}
  .integrated-grid{grid-template-columns:1fr}
  .kpi-row{grid-template-columns:repeat(2,1fr)}
}
</style>
</head>
<body>

<!-- ── 로그인 화면 ── -->
<div id="loginScreen" class="login-screen">
  <div class="login-card">
    <div class="login-logo">NARKA</div>
    <div class="login-sub">광고 성과 대시보드</div>
    <div class="login-title">팀원 전용 접속</div>
    <div class="login-desc">허용된 Google 계정으로만 접속 가능합니다.<br>접속 권한 문의: unee@uncmhm.com</div>
    <button class="google-btn" onclick="signInWithGoogle()">
      <svg class="google-icon" viewBox="0 0 24 24">
        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
        <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
      </svg>
      Google 계정으로 로그인
    </button>
    <div class="login-error" id="loginError"></div>
  </div>
</div>

<!-- ── 메인 대시보드 ── -->
<div id="mainApp" class="hidden">
  <div class="topbar">
    <div class="logo">NARKA</div>
    <div style="font-size:11px;color:#aaa">광고 성과 대시보드</div>
    <div class="topbar-right">
      <div class="user-info">
        <span class="user-name" id="userName"></span>
        <span id="userRole" style="font-size:10px;color:#666;margin-left:4px"></span>
      </div>
      <button class="logout-btn" onclick="signOut()">로그아웃</button>
      <div style="font-size:10px;color:#666" id="lastUpdate"></div>
    </div>
  </div>

  <!-- 채널 탭 -->
  <div class="channel-tabs">
    <div class="ch-tab active" onclick="switchChannel('integrated',this)">🔗 통합</div>
    <div class="ch-tab" onclick="switchChannel('oy',this)">🛒 올리브영</div>
    <div class="ch-tab" onclick="switchChannel('js',this)">🏪 자사몰</div>
  </div>

  <!-- 저장 상태 바 -->
  <div class="save-bar hidden" id="saveBar">✅ 데이터가 자동 저장되었습니다 — 다음 접속 시 자동으로 불러와요</div>

  <!-- 채널별 컨텐츠 -->
  <div id="channelContent"></div>
</div>

<script>
'use strict';

// 막대+꺾은선 혼합 차트에서 꺾은선이 항상 막대 위(앞)에 보이도록 전역 draw order 고정.
// Chart.js는 order 값이 클수록 나중에(=위에) 그려짐 — line을 bar보다 높게 설정.
if(typeof Chart!=='undefined'){
  Chart.defaults.datasets.bar = Chart.defaults.datasets.bar || {};
  Chart.defaults.datasets.bar.order = 1;
  Chart.defaults.datasets.line = Chart.defaults.datasets.line || {};
  Chart.defaults.datasets.line.order = 2;
}

// 꺾은선 색상 단일 소스 — 지표별로 전 차트가 동일 색을 쓰도록 통일
const LINE_COLORS = {
  broas:'#89857E',    // B-ROAS(브랜디드/자사몰 매출 기준) — 점선
  roas:'#1C1502',     // 광고 ROAS(통합/일반) — 실선
  metaRoas:'#174D86', // META ROAS — 실선
  cpcRoas:'#6690BD',  // CPC ROAS — 실선
  bep:'#ED5A5D',      // BEP 기준선 — 점선
};
// hex→rgba 변환 (실선 ROAS 계열을 살짝 연하게: 굵기 70%, 불투명도 70%로 완화)
const hexA=(hex,a)=>{
  const h=hex.replace('#','');
  const r=parseInt(h.slice(0,2),16),g=parseInt(h.slice(2,4),16),b=parseInt(h.slice(4,6),16);
  return `rgba(${r},${g},${b},${a})`;
};
LINE_COLORS.roasSoft = hexA(LINE_COLORS.roas,0.7);
LINE_COLORS.metaRoasSoft = hexA(LINE_COLORS.metaRoas,0.7);
LINE_COLORS.cpcRoasSoft = hexA(LINE_COLORS.cpcRoas,0.7);

const SUPABASE_URL = 'https://iogenimoqzoklogosagg.supabase.co';
const SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlvZ2VuaW1vcXpva2xvZ29zYWdnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODIzMjU5ODAsImV4cCI6MjA5NzkwMTk4MH0.bVsj6-P0cXZ6qfbVulSomlR0e6bRRYx4S8BOIYjh1hw';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON);

let curChannel = 'integrated';
let curTab = {oy:'monthly', js:'monthly', integrated:'monthly'};
let drStart = {oy:null, js:null, integrated:null};
let drEnd = {oy:null, js:null, integrated:null};
let curProd = {
  oy:{p12:'all',p21:'all',p22:'all',c12Basis:'online',prodMedia:'masca',mediaMode:'all'},
  js:{p12:'all',p21:'all',p22:'all'}
};

// BEP ROAS 기준선 (원가율 시트 기준)
// 캔버스 재사용 시 기존 차트 파괴 후 생성
function newChart(el, cfg){
  if(!el) return null;
  const prev = (typeof Chart!=='undefined' && Chart.getChart) ? Chart.getChart(el) : null;
  if(prev){ try{ prev.destroy(); }catch(e){} }
  return new Chart(el, cfg);
}

function toDate(raw){
  const s=String(raw??'').trim();
  if(!s)return null;
  if(/^\d{5}$/.test(s)){const d=new Date((+s-25569)*86400*1000);if(!isNaN(d))return d;}
  const m=s.match(/^(\d{2,4})[.\-\/\s]+(\d{1,2})[.\-\/\s]+(\d{1,2})/);
  if(m){let y=+m[1];if(y<100)y+=2000;return new Date(y,+m[2]-1,+m[3]);}
  const d=new Date(s);return isNaN(d)?null:d;
}

function parseCSV(text){
  return text.split(/\r?\n/).map(line=>{
    const cells=[];let cur='',q=false;
    for(let i=0;i<line.length;i++){
      if(line[i]==='"'){q=!q;}
      else if(line[i]===','&&!q){cells.push(cur);cur='';}
      else cur+=line[i];
    }
    cells.push(cur);
    return cells.map(c=>c.trim().replace(/^"|"$/g,''));
  }).filter(r=>r.some(c=>c!==''));
}

async function fetchFromSheets(ch, _isRetry){
  const stEl = document.getElementById(`st_${ch}_sheets`);
  if(stEl && !_isRetry){stEl.textContent='⏳ 불러오는 중...';stEl.className='file-status st-load';}

  const EDGE_URL = `${SUPABASE_URL}/functions/v1/fetch-sheets`;
  const session = (await sb.auth.getSession()).data.session;
  const token = session?.access_token;

  // 서버가 한동안 쉬고 있었다면 첫 요청이 깨우는 데만 몇 초 걸릴 수 있음(콜드 스타트).
  // 15초 넘게 응답이 없으면 사용자에게 원인을 알려주고, 25초에는 요청 자체를 끊어 재시도로 넘어간다.
  const coldStartTimer = setTimeout(()=>{
    if(stEl && !_isRetry){stEl.textContent='⏳ 서버가 깨어나는 중입니다, 잠시만요...';stEl.className='file-status st-load';}
  }, 15000);

  const fetchSheet = async (spreadsheetId, sheetName) => {
    const ctrl = new AbortController();
    const abortTimer = setTimeout(()=>ctrl.abort(), 25000);
    try{
      const res = await fetch(EDGE_URL, {
        method:'POST',
        headers:{'Content-Type':'application/json','Authorization':`Bearer ${token}`},
        body: JSON.stringify({ spreadsheetId, sheetName }),
        signal: ctrl.signal,
      });
      const data = await res.json();
      if(data.error) throw new Error(`${sheetName}: ${data.error}`);
      return data.values || [];
    } catch(e){
      if(e.name==='AbortError') throw new Error(`${sheetName}: 응답 시간 초과(서버 대기)`);
      throw e;
    } finally {
      clearTimeout(abortTimer);
    }
  };

  try {
    let salesRows=[], paidRows=[];

    if(ch==='oy'){
      // 올리브영 원본 시트에서 직접 읽기 — 두 시트는 서로 독립적이므로 동시에 요청해 대기 시간을 절반으로 줄인다
      const OY_ID = '1cL2Y5W-O7PSs8CCcLo2xrl6RXB68a5nbJvjroi3uK4g';
      const [raw1, raw2] = await Promise.all([
        fetchSheet(OY_ID, '[전체] Daily'),
        fetchSheet(OY_ID, '[국내] paid'),
      ]);
      window.RAW = {...(window.RAW||{}), oyDaily: raw1, oyPaid: raw2};
      const parsed = parseOySheets(raw1, raw2);
      salesRows = parsed.sales;
      paidRows = parsed.paid;
    } else {
      // 자사몰 원본 시트에서 직접 읽기
      const JS_ID = '1VYChlkN9fIggDrh8YuCj7sgML1aIsAcHUVLUFPnkEB0';
      const raw = await fetchSheet(JS_ID, 'daily 매출 대시보드');
      window.RAW = {...(window.RAW||{}), js: raw};
      const parsed = parseJsSheet(raw);
      salesRows = parsed.sales;
      paidRows = parsed.paid;
    }

    clearTimeout(coldStartTimer);
    DATA[ch].sales = salesRows;
    DATA[ch].paid = paidRows;
    saveLocal(ch);
    document.getElementById('saveBar')?.classList.remove('hidden');
    setTimeout(()=>document.getElementById('saveBar')?.classList.add('hidden'),3000);
    document.getElementById('lastUpdate').textContent='업데이트: '+new Date().toLocaleString('ko-KR');

    if(stEl){
      stEl.textContent=`✅ ${salesRows.length}일 로드 완료 (${new Date().toLocaleTimeString('ko-KR')})`;
      stEl.className='file-status st-ok';
    }
    const stS=document.getElementById(`st_${ch}_sales`);
    const stP=document.getElementById(`st_${ch}_paid`);
    if(stS){stS.textContent=`✅ ${salesRows.length}일`;stS.className='file-status st-ok';}
    if(stP){stP.textContent=`✅ ${paidRows.length}일`;stP.className='file-status st-ok';}

    renderChannel(curChannel);
  } catch(err){
    clearTimeout(coldStartTimer);
    // 첫 시도가 타임아웃으로 실패한 경우, 서버가 이미 깨어났을 가능성이 높으므로 한 번만 조용히 재시도
    if(!_isRetry && /응답 시간 초과/.test(err.message)){
      if(stEl){stEl.textContent='⏳ 재시도 중...';stEl.className='file-status st-load';}
      return fetchFromSheets(ch, true);
    }
    if(stEl){
      stEl.textContent = _isRetry
        ? '❌ 서버 응답 없음 — 30초 후 다시 눌러주세요'
        : '❌ 오류: '+err.message;
      stEl.className='file-status st-err';
    }
    console.error(err);
  }
}

const PARSER_VERSION = 22;

function saveLocal(ch){
  try{
    localStorage.setItem('narka_'+ch, JSON.stringify({
      pv:PARSER_VERSION, sales:DATA[ch].sales, paid:DATA[ch].paid, ts:Date.now()
    }));
  }catch(e){console.warn('localStorage 저장 실패',e);}

function loadLocal(ch){
  try{
    const raw=localStorage.getItem('narka_'+ch);
    if(!raw)return false;
    const o=JSON.parse(raw);
    if(o.pv!==PARSER_VERSION){
      localStorage.removeItem('narka_'+ch);
      console.warn(`[${ch}] 파서 버전 변경(${o.pv||'없음'}→${PARSER_VERSION}) — 캐시 폐기. "Sheets에서 자동 불러오기"로 다시 읽어주세요.`);
      return false;
    }
    if(!o.sales||!o.sales.length)return false;
    DATA[ch].sales=o.sales.map(r=>({...r,date:new Date(r.date)}));
    DATA[ch].paid=(o.paid||[]).map(r=>({...r,date:new Date(r.date)}));
    return true;
  }catch(e){return false;}
}

async function saveToSupabase(channel, type, rows){
  const table=`${channel}_${type}`;
  // 기존 데이터 삭제 후 새로 insert
  await sb.from(table).delete().neq('id',0);

  if(!rows.length)return;

  const batchSize=500;
  for(let i=0;i<rows.length;i+=batchSize){
    const batch=rows.slice(i,i+batchSize);
    await sb.from(table).insert(batch);
  }

  document.getElementById('saveBar').classList.remove('hidden');
  setTimeout(()=>document.getElementById('saveBar').classList.add('hidden'),3000);
  document.getElementById('lastUpdate').textContent='업데이트: '+new Date().toLocaleString('ko-KR');
}

  const isStale=ch=>{

  }

// 올리브영 원본 시트 파서
// raw1: [전체] Daily (A:AD), raw2: [국내] paid (A:BD)
// 헤더 2행, 데이터 3행~
function parseOySheets(raw1, raw2){
  const g=(i,r)=>{const v=r?.[i];return v!=null&&v!==''?parseFloat(String(v).replace(/,|%/g,''))||0:0;};
  const gDate=(r)=>{
    const v=r?.[0];if(!v)return null;
    const s=String(v).trim();
    const m=s.match(/(\d{2,4})[.\-\/\s]+(\d{1,2})[.\-\/\s]+(\d{1,2})/);
    if(m){let y=+m[1];if(y<100)y+=2000;return new Date(y,+m[2]-1,+m[3]);}
    return null;
  };

  // raw1 매핑: [전체] Daily
  // E=4:날짜, I=8:온라인주문기준, C=2:국내+글로벌출고(전체), D=3:국내출고
  // H=7:말차, I=8:슈퍼픽스출고? -> 실제로 올영data A=날짜(RAW1-E), B=온라인(RAW1-I), C=국내+글로벌(RAW1-K), D=국내(RAW1-J)
  // 아까 매핑 기준:
  // A-RAW1-E(날짜), B-RAW1-I(온라인), D-RAW1-J(국내), E-RAW1-K, F-RAW1-L, G-RAW1-M
  // H-RAW1-AD, I-RAW1-Z+AA, J-RAW1-Q+R+S+T, K-RAW1-U+AB+AC, L-RAW1-V+X+Y
  // RAW1 0-based: E=4,I=8,J=9,K=10,L=11,M=12,Q=16,R=17,S=18,T=19,U=20,V=21,X=23,Y=24,Z=25,AA=26,AB=27,AC=28,AD=29

  // raw2 매핑: [국내] paid
  // O-RAW2-K(11), P-RAW2-L(12)
  // V-RAW2-AF(31), W-RAW2-AD(29), X-RAW2-X(23), Y-RAW2-Z(25), Z-RAW2-AB(27)
  // AA-RAW2-AG(32), AB-RAW2-AE(30), AC-RAW2-Y(24), AD-RAW2-AA(26), AE-RAW2-AC(28)
  // AV-RAW2-AW(48), AW-RAW2-AU(46), AX-RAW2-AQ(42), AY-RAW2-AO(40), AZ-RAW2-AS(44)
  // BF-RAW2-AX(49), BG-RAW2-AV(47), BH-RAW2-AP(41), BI-RAW2-AR(43), BJ-RAW2-AT(45)

  // raw2는 헤더 2행, 데이터 3행~
  // raw2 날짜 인덱스 확인 필요 - 보통 A=0

  const sales=[], paid=[];
  const startRow = 2; // 3행부터 (0-based index 2)

  // [전체] Daily — 2026.08 콘솔 실측 기준, 헤더 3행, 데이터 4행(index 3)~
  // 4=E 날짜 / 6=G 프로모션 / 7=H TOTAL(국내+글로벌) / 8=I 온라인 주문금(주문 기준)
  // 9=J 국내(출고) / 10=K 온라인(출고) / 11=L 오프라인 / 12=M 글로벌
  // 13=N TOTAL ROAS / 14=O KR-ROAS / 15=P Global-ROAS / 16~29=Q~AD 품목별 매출
  // 검산: 10+11=9, 9+12=7
  for(let i=3; i<raw1.length; i++){
    const r1=raw1[i];
    const v=r1?.[4]; if(!v)continue; // E열 = 날짜
    const s=String(v).trim();
    const m=s.match(/(\d{2,4})[.\-\/\s]+(\d{1,2})[.\-\/\s]+(\d{1,2})/);
    if(!m)continue;
    let y=+m[1];if(y<100)y+=2000;
    const dt=new Date(y,+m[2]-1,+m[3]);
    if(dt.getFullYear()<2024||dt.getFullYear()>2030)continue;

    // 전체 매출 = J열(9) 국내 출고 기준 / 온라인 매출 = I열(8) 온라인 당일 주문금 기준
    // 광고비·광고전환매출이 당일 집행·당일 주문 기준이므로 ROAS 분모·분자 시점을 맞추기 위해 주문금을 사용.
    // K열(10)은 출고 기준이라 미출고분이 익일로 밀려 당일 ROAS가 왜곡되고, 2025-07~10 구간은 미입력.
    const total=g(9,r1), online=g(8,r1);
    if(total===0&&online===0)continue;

    sales.push({date:dt,
      total, online,
      matcha:g(29,r1),                              // AD
      spx:g(25,r1)+g(26,r1),                        // Z+AA
      masca:g(16,r1)+g(17,r1)+g(18,r1)+g(19,r1),    // Q+R+S+T
      nose:g(20,r1)+g(27,r1)+g(28,r1),              // U+AB+AC
      milk:g(21,r1)+g(23,r1)+g(24,r1),              // V+X+Y
    });
  }

  // raw2([국내] paid) 파싱 — 2026.08 콘솔 실측(dumpCols) 기준, 총 56열
  // 4=날짜
  // [전환매출] 6=전체 7=META 8=CPC
  // [광고지출] 9=전체 10=META 11=CPC  12=CRM
  // [ROAS]    13=전체 14=META 15=CPC
  // [품목별 ROAS(시트 계산값, 미사용)] 16=마스카라 17=노세범 18=밀크 19=슈퍼픽스 20=말차 21=립소르베 22=헤어미스트
  // [품목별 광고지출] 품목당 META,CPC 2열씩
  //   23/24=마스카라 25/26=노세범 27/28=밀크 29/30=슈퍼픽스 31/32=말차 33/34=립소르베 35/36=헤어미스트 37/38=기타 39=기타CRM
  // [품목별 전환매출] 품목당 META,CPC 2열씩
  //   40/41=마스카라 42/43=노세범 44/45=밀크 46/47=슈퍼픽스 48/49=말차 50/51=립소르베 52/53=헤어미스트 54/55=기타
  // 검증: 23~39 META합 = 10열(전체지출 META), 40~55 META합 = 7열(전환매출 META) 일치 확인함
  for(let i=3; i<raw2.length; i++){
    const r2=raw2[i];
    const v=r2?.[4]; if(!v)continue;
    const s=String(v).trim();
    const m=s.match(/(\d{2,4})[.\-\/\s]+(\d{1,2})[.\-\/\s]+(\d{1,2})/);
    if(!m)continue;
    let y=+m[1];if(y<100)y+=2000;
    const dt=new Date(y,+m[2]-1,+m[3]);
    if(dt.getFullYear()<2024||dt.getFullYear()>2030)continue;

    const adSpend=g(9,r2), metaSpend=g(10,r2), cpcSpend=g(11,r2);
    const adSales=g(6,r2), metaSales=g(7,r2), cpcSales=g(8,r2);
    if(adSpend===0&&adSales===0)continue;

    paid.push({date:dt,
      adSales, metaSales, cpcSales,
      adSpend, metaSpend, cpcSpend,
      // 품목별 광고지출 (23~34: 품목당 META, CPC 순)
      mascaMetaSpend:g(23,r2), mascaCpcSpend:g(24,r2),
      noseMetaSpend:g(25,r2),  noseCpcSpend:g(26,r2),
      milkMetaSpend:g(27,r2),  milkCpcSpend:g(28,r2),
      spxMetaSpend:g(29,r2),   spxCpcSpend:g(30,r2),
      matchaMetaSpend:g(31,r2),matchaCpcSpend:g(32,r2),
      lipMetaSpend:g(33,r2),   lipCpcSpend:g(34,r2),
      mascaSpend:g(23,r2)+g(24,r2), noseSpend:g(25,r2)+g(26,r2),
      milkSpend:g(27,r2)+g(28,r2),  spxSpend:g(29,r2)+g(30,r2),
      matchaSpend:g(31,r2)+g(32,r2),lipSpend:g(33,r2)+g(34,r2),
      // 품목별 광고 전환매출 (40~51: 품목당 META, CPC 순)
      mascaMetaCV:g(40,r2), mascaCpcCV:g(41,r2),
      noseMetaCV:g(42,r2),  noseCpcCV:g(43,r2),
      milkMetaCV:g(44,r2),  milkCpcCV:g(45,r2),
      spxMetaCV:g(46,r2),   spxCpcCV:g(47,r2),
      matchaMetaCV:g(48,r2),matchaCpcCV:g(49,r2),
      lipMetaCV:g(50,r2),   lipCpcCV:g(51,r2),
      mascaCV:g(40,r2)+g(41,r2), noseCV:g(42,r2)+g(43,r2),
      milkCV:g(44,r2)+g(45,r2),  spxCV:g(46,r2)+g(47,r2),
      matchaCV:g(48,r2)+g(49,r2),lipCV:g(50,r2)+g(51,r2),
    });
  }

  return {sales, paid};
}

function parseJsSheet(raw){
  const g=(i,r)=>{const v=r?.[i];return v!=null&&v!==''?parseFloat(String(v).replace(/,|%/g,''))||0:0;};
  const sales=[], paid=[];

  // 실제 인덱스(콘솔 확인):
  // 3=일(날짜) 5=방문자수 6=구매건수 7=전환율
  // 8=전체매출 9=자사몰매출
  // 11=말차 12=슈퍼픽스 13=헤어마스카라 14=노세범 15=밀크
  // 32=전체지출 34=메타전체지출
  // 35=헤어마스카라지출 36=말차 37=슈퍼픽스 38=노세범 39=밀크
  // 47=메타전체매출(전환) 48=헤어마스카라 49=말차 50=슈퍼픽스 51=노세범 52=밀크
  for(let i=2; i<raw.length; i++){
    const r=raw[i];
    const v=r?.[3]; if(!v)continue;
    const s2=String(v).trim();
    const m=s2.match(/(\d{2,4})[.\-\/\s]+(\d{1,2})[.\-\/\s]+(\d{1,2})/);
    if(!m)continue;
    let y=+m[1];if(y<100)y+=2000;
    const dt=new Date(y,+m[2]-1,+m[3]);
    if(dt.getFullYear()<2024||dt.getFullYear()>2030)continue;

    const total=g(8,r), online=g(9,r);
    const adSpend=g(32,r), adSales=g(47,r);
    if(total===0&&online===0&&adSpend===0)continue;

    sales.push({date:dt, total, online,
      matcha:g(11,r), spx:g(12,r), masca:g(13,r), nose:g(14,r), milk:g(15,r),
      visitors:g(5,r), purchases:g(6,r),
      cvRate:g(5,r)>0?Math.round(g(6,r)/g(5,r)*1000)/10:0,
    });

    paid.push({date:dt,
      adSales, metaSales:adSales, cpcSales:0,
      adSpend, metaSpend:g(34,r), cpcSpend:0,
      mascaSpend:g(35,r), matchaSpend:g(36,r), spxSpend:g(37,r), noseSpend:g(38,r), milkSpend:g(39,r), lipSpend:0,
      mascaMetaSpend:g(35,r), mascaCpcSpend:0,
      matchaMetaSpend:g(36,r), matchaCpcSpend:0,
      spxMetaSpend:g(37,r), spxCpcSpend:0,
      noseMetaSpend:g(38,r), noseCpcSpend:0,
      milkMetaSpend:g(39,r), milkCpcSpend:0,
      lipMetaSpend:0, lipCpcSpend:0,
      mascaCV:g(48,r), matchaCV:g(49,r), spxCV:g(50,r), noseCV:g(51,r), milkCV:g(52,r), lipCV:0,
      mascaMetaCV:g(48,r), mascaCpcCV:0,
      matchaMetaCV:g(49,r), matchaCpcCV:0,
      spxMetaCV:g(50,r), spxCpcCV:0,
      noseMetaCV:g(51,r), noseCpcCV:0,
      milkMetaCV:g(52,r), milkCpcCV:0,
      lipMetaCV:0, lipCpcCV:0,
    });
  }
  return {sales, paid};
}

      });
      paid.push({date:dt,
        adSales:g(22,r), metaSales:g(22,r), cpcSales:0,

        mascaSpend:g(18,r), noseSpend:g(19,r), milkSpend:g(20,r), spxSpend:g(17,r),

}

function parseSalesCSV(text,ch){
  dbLog=[];
  const rows=parseCSV(text);
  let hIdx=-1;
  for(let i=0;i<Math.min(10,rows.length);i++){
    if(rows[i].some(c=>c==='날짜'||c==='요일')){hIdx=i;break;}
  }
  dlog('헤더 행',hIdx>=0?hIdx+'번째':'없음',hIdx>=0?'dok':'derr');
  if(hIdx<0)return[];
  const hdr=rows[hIdx];
  const fi=kws=>{for(const kw of kws){const i=hdr.findIndex(h=>h.includes(kw));if(i>=0)return i;}return -1;};
  const iDate=fi(['날짜']);
  const iTotal=fi(['TOTAL(국내+글로벌)','TOTAL','전체매출']);
  const iOnline=fi(['온라인 주문금','온라인주문금','온라인 주문']);
  const iMasca=hdr.findIndex(h=>h==='헤어 마스카라'||h==='헤어마스카라');
  const iNose=hdr.findIndex(h=>h==='노세범');
  const iMilk=hdr.findIndex(h=>(h==='헤어 밀크'||h==='헤어밀크')&&!h.includes('AD'));
  const iLip=fi(['립소르베']);
  const iSpx=hdr.findIndex(h=>h.includes('슈퍼픽스')&&!h.includes('ROAS'));
  const iMatcha=fi(['말차샴푸','말차']);
  const out=[];
  for(let i=hIdx+1;i<rows.length;i++){
    const r=rows[i];
    const dt=toDate(r[iDate]);
    if(!dt||dt.getFullYear()<2024||dt.getFullYear()>2030)continue;
    const total=iTotal>=0?pn(r[iTotal]):0;
    const online=iOnline>=0?pn(r[iOnline]):0;
    if(total===0&&online===0)continue;
    out.push({date:dt,total,online,
      masca:iMasca>=0?pn(r[iMasca]):0,nose:iNose>=0?pn(r[iNose]):0,
      milk:iMilk>=0?pn(r[iMilk]):0,lip:iLip>=0?pn(r[iLip]):0,
      spx:iSpx>=0?pn(r[iSpx]):0,matcha:iMatcha>=0?pn(r[iMatcha]):0,
    });
  }
  dlog('파싱 완료',out.length+'개',out.length>0?'dok':'derr');
  return out.sort((a,b)=>a.date-b.date);
}

function readFile(file,cb){
  const r=new FileReader();
  r.onload=e=>{
    let t=e.target.result;
    if(!/[가-힣]/.test(t)){
      const r2=new FileReader();
      r2.onload=e2=>cb(e2.target.result);
      r2.readAsText(file,'euc-kr');
    } else cb(t);
  };
  r.readAsText(file,'utf-8');
}

function handleUpload(ch,type,file){
  const stId=`st_${ch}_${type==='sales'?'sales':'paid'}`;
  const el=document.getElementById(stId);
  if(el){el.textContent='⏳ 처리 중...';el.className='file-status st-load';}

  readFile(file,text=>{
    const rows=type==='sales'?parseSalesCSV(text,ch):parsePaidCSV(text,ch);
    DATA[ch][type==='sales'?'sales':'paid']=rows.map(r=>{
      if(type==='paid'){
        r.mascaSpend=(r.mascaMetaSpend||0)+(r.mascaCpcSpend||0);
        r.noseSpend=(r.noseMetaSpend||0)+(r.noseCpcSpend||0);
        r.milkSpend=(r.milkMetaSpend||0)+(r.milkCpcSpend||0);
        r.spxSpend=(r.spxMetaSpend||0)+(r.spxCpcSpend||0);
        r.lipSpend=(r.lipMetaSpend||0)+(r.lipCpcSpend||0);
        r.mascaCV=(r.mascaMetaCV||0)+(r.mascaCpcCV||0);
        r.noseCV=(r.noseMetaCV||0)+(r.noseCpcCV||0);
        r.milkCV=(r.milkMetaCV||0)+(r.milkCpcCV||0);
        r.spxCV=(r.spxMetaCV||0)+(r.spxCpcCV||0);
        r.lipCV=(r.lipMetaCV||0)+(r.lipCpcCV||0);
      }
      return r;
    });

    if(el){
      if(rows.length){el.textContent=`✅ ${rows.length}일 로드`;el.className='file-status st-ok';}
      else{el.textContent='❌ 파싱 실패';el.className='file-status st-err';}
    }

    // localStorage 저장
    saveLocal(ch);
    document.getElementById('saveBar')?.classList.remove('hidden');
    setTimeout(()=>document.getElementById('saveBar')?.classList.add('hidden'),3000);
    document.getElementById('lastUpdate').textContent='업데이트: '+new Date().toLocaleString('ko-KR');

    renderChannel(curChannel);
  });
}

function switchChannel(ch,el){
  curChannel=ch;
  document.querySelectorAll('.ch-tab').forEach(t=>t.classList.remove('active'));
  if(el)el.classList.add('active');
  renderChannel(ch);
}

function renderChannel(ch){
  Object.values(charts).forEach(c=>{try{c.destroy();}catch(e){}});
  charts={};
  const content=document.getElementById('channelContent');
  if(ch==='integrated'){
    content.innerHTML=buildIntegrated();
    setTimeout(renderIntegratedCharts,60);
  } else if(ch==='js'){
    const rows=getRows('js',curTab['js']);
    const valid=rows.filter(r=>(r.total||0)>0||(r.adSpend||0)>0);
    content.innerHTML=buildJsDash(rows,valid,curTab['js']);
    setTimeout(async ()=>{
      renderChannelCharts('js');
      renderJsIssuePanel();
      await refreshJsIssuesCache();
      renderJsIssuePanel();
      rerenderJsTrafficOnly();
    },60);
  } else {
    content.innerHTML=buildChannelDash(ch);
    setTimeout(()=>renderChannelCharts(ch),60);
  }
}

function buildIntegrated(){
  const intTab=curTab['integrated']||'monthly';
  const oyRows=getRows('oy',intTab,'integrated');
  const jsRows=getRows('js',intTab,'integrated');
  const oyValid=oyRows.filter(r=>(r.total||0)>0);
  const jsValid=jsRows.filter(r=>(r.total||0)>0);
  const dv=d=>d?new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10):'';

  const S=(rows,f)=>rows.reduce((t,r)=>t+(r[f]||0),0);
  const oyTot=S(oyValid,'total'),oyOnl=S(oyValid,'online'),oyAdSp=S(oyValid,'adSpend'),oyAdCv=S(oyValid,'adSales');
  const jsTot=S(jsValid,'total'),jsOnl=S(jsValid,'online'),jsAdSp=S(jsValid,'adSpend'),jsAdCv=S(jsValid,'adSales');
  const oyMediaRoas=oyAdSp>0?oyAdCv/oyAdSp:null;
  const jsMediaRoas=jsAdSp>0?jsAdCv/jsAdSp:null;

  const oySummary=`
    <div class="summary-kpi-row">
      <div class="summary-kpi"><div class="summary-kpi-label">전체 매출</div><div class="summary-kpi-val sk-full">${fmt(Math.round(oyTot))}<small>원</small></div><div class="summary-kpi-sub">sell-out 기준</div></div>

      <div class="summary-kpi"><div class="summary-kpi-label">B-ROAS</div><div class="summary-kpi-val" style="color:#7B2D8B">${fmtRoas(oyAdSp>0?oyTot/oyAdSp:null)}</div><div class="summary-kpi-sub">온오프라인 전체 매출 기준</div></div>
      <div class="summary-kpi"><div class="summary-kpi-label">광고 지출 / 매체 ROAS</div><div class="summary-kpi-val" style="color:#C05E1A">${fmtRoas(oyMediaRoas)}</div><div class="summary-kpi-sub">광고지출 ${fmt(Math.round(oyAdSp))}원</div></div>
    </div>

function buildProfitCalc(oyRows,jsRows){
  const S=(rows,f)=>rows.reduce((t,r)=>t+(r[f]||0),0);
  const oyRev=S(oyRows,'total'), jsRev=S(jsRows,'total');
  const oyAdSp=S(oyRows,'adSpend'), jsAdSp=S(jsRows,'adSpend');

  const O=COST_RATES.oy, J=COST_RATES.js;
  // 올리브영: 채널수수료 + 원가 + 물류비 + 광고비
  const oyFee=Math.round(oyRev*O.channel);
  const oyCogs=Math.round(oyRev*O.cogs);
  const oyLog=Math.round(oyRev*O.logistics);
  const oyLeft=oyRev-oyFee-oyCogs-oyLog-oyAdSp;
  // 자사몰: PG수수료 + 원가 + 물류대행 + 광고비
  const jsPg=Math.round(jsRev*J.pg);
  const jsCogs=Math.round(jsRev*J.cogs);
  const jsLog=Math.round(jsRev*J.logistics3pl);
  const jsLeft=jsRev-jsPg-jsCogs-jsLog-jsAdSp;

  const totRev=oyRev+jsRev, totAd=oyAdSp+jsAdSp;
  const totFee=oyFee+jsPg, totCogs=oyCogs+jsCogs, totLog=oyLog+jsLog;
  const totLeft=oyLeft+jsLeft;
  const pct=(v,base)=>base>0?` <span style="font-size:10px;color:#bbb">(${(v/base*100).toFixed(1)}%)</span>`:'';

  return `
  <div class="profit-grid">
    <div class="profit-card">
      <h4>🛒 올리브영</h4>
      <div class="profit-row"><span class="profit-label">총 매출</span><span class="profit-val">${fmt(oyRev)}원</span></div>
      <div class="profit-row"><span class="profit-label">올리브영 채널 수수료 (${(O.channel*100).toFixed(0)}% sell-out)</span><span class="profit-val c-dn">-${fmt(oyFee)}원</span></div>
      <div class="profit-row"><span class="profit-label">원가(기획세트 평균) (${(O.cogs*100).toFixed(0)}%)</span><span class="profit-val c-dn">-${fmt(oyCogs)}원</span></div>
      <div class="profit-row"><span class="profit-label">물류비 (${(O.logistics*100).toFixed(1)}%)</span><span class="profit-val c-dn">-${fmt(oyLog)}원</span></div>
      <div class="profit-row"><span class="profit-label">실 지출 광고비${pct(oyAdSp,oyRev)}</span><span class="profit-val c-dn">-${fmt(oyAdSp)}원</span></div>
      <div class="profit-total">
        <span class="profit-total-label">손익 추정</span>
        <span class="profit-total-val">${fmt(oyLeft)}원</span>
      </div>
      <p style="font-size:10px;color:#aaa;margin-top:6px">잔여율 ${oyRev>0?(oyLeft/oyRev*100).toFixed(1):'-'}%<br>(평균치 기준 예상 손익, 단순 참고)</p>
    </div>
    <div class="profit-card">
      <h4>🏪 자사몰</h4>
      <div class="profit-row"><span class="profit-label">총 매출</span><span class="profit-val">${fmt(jsRev)}원</span></div>
      <div class="profit-row"><span class="profit-label">PG 수수료 (${(J.pg*100).toFixed(1)}%)</span><span class="profit-val c-dn">-${fmt(jsPg)}원</span></div>
      <div class="profit-row"><span class="profit-label">원가 (${(J.cogs*100).toFixed(1)}%)</span><span class="profit-val c-dn">-${fmt(jsCogs)}원</span></div>
      <div class="profit-row"><span class="profit-label">물류대행비 (${(J.logistics3pl*100).toFixed(1)}%)</span><span class="profit-val c-dn">-${fmt(jsLog)}원</span></div>
      <div class="profit-row"><span class="profit-label">실 지출 광고비${pct(jsAdSp,jsRev)}</span><span class="profit-val c-dn">-${fmt(jsAdSp)}원</span></div>
      <div class="profit-total">
        <span class="profit-total-label">손익 추정</span>
        <span class="profit-total-val">${fmt(jsLeft)}원</span>
      </div>
      <p style="font-size:10px;color:#aaa;margin-top:6px">잔여율 ${jsRev>0?(jsLeft/jsRev*100).toFixed(1):'-'}%<br>(평균치 기준 예상 손익, 단순 참고)</p>
    </div>
    <div class="profit-card">
      <h4>📊 통합</h4>
      <div class="profit-row"><span class="profit-label">통합 총 매출</span><span class="profit-val">${fmt(totRev)}원</span></div>
      <div class="profit-row"><span class="profit-label">채널·PG 수수료</span><span class="profit-val c-dn">-${fmt(totFee)}원</span></div>
      <div class="profit-row"><span class="profit-label">원가</span><span class="profit-val c-dn">-${fmt(totCogs)}원</span></div>
      <div class="profit-row"><span class="profit-label">물류비</span><span class="profit-val c-dn">-${fmt(totLog)}원</span></div>
      <div class="profit-row"><span class="profit-label">실 지출 광고비${pct(totAd,totRev)}</span><span class="profit-val c-dn">-${fmt(totAd)}원</span></div>
      <div class="profit-total">
        <span class="profit-total-label">손익 추정</span>
        <span class="profit-total-val">${fmt(totLeft)}원</span>
      </div>
      <p style="font-size:10px;color:#aaa;margin-top:8px">* 원가율 OY ${(O.cogs*100).toFixed(1)}% / 자사몰 ${(J.cogs*100).toFixed(1)}% 고정 적용. VAT 미반영, 인건비·기타 고정비 제외<br>(평균치 기준 예상 손익, 단순 참고)</p>
    </div>
  </div>`;
}

function renderIntegratedCharts(){
  const intTab=curTab['integrated']||'monthly';
  const oyRows=getRows('oy',intTab,'integrated').filter(r=>(r.total||0)>0);
  const jsRows=getRows('js',intTab,'integrated').filter(r=>(r.total||0)>0);

  // 도넛 차트 - 품목별 매출 비중
  const PROD_KEYS=PRODUCT_META.map(p=>p.k);
  const PROD_LABELS=PRODUCT_META.map(p=>p.l);
  const PROD_COLORS=PRODUCT_META.map(p=>p.color);

  // 상시 표시 라벨: 비중 10% 이상인 품목의 이름·%를 슬라이스 위에 항상 표시(호버 없이도 보임). 10% 미만은 칸이 작아 생략
  const topSliceLabels={
    id:'topSliceLabels',
    afterDraw(chart){
      const meta=chart.getDatasetMeta(0);
      const dataset=chart.data.datasets[0];
      const total=dataset.data.reduce((a,b)=>a+(b||0),0);
      if(!total)return;
      const shown=dataset.data
        .map((v,i)=>({v:v||0,i}))
        .filter(o=>o.v>0 && (o.v/total)>=0.10);
      const {ctx}=chart;
      ctx.save();
      shown.forEach(({v,i})=>{
        const arc=meta.data[i];
        if(!arc)return;
        const p=arc.getProps?arc.getProps(['x','y','startAngle','endAngle','innerRadius','outerRadius'],true):arc;
        const mid=(p.startAngle+p.endAngle)/2;
        const r=(p.innerRadius+p.outerRadius)/2;
        const lx=p.x+Math.cos(mid)*r, ly=p.y+Math.sin(mid)*r;
        const pct=(v/total*100).toFixed(0)+'%';
        const label=chart.data.labels[i];
        ctx.textAlign='center';ctx.textBaseline='middle';
        ctx.lineWidth=3;ctx.strokeStyle='rgba(0,0,0,0.4)';ctx.fillStyle='#fff';
        ctx.font='bold 11px Malgun Gothic';
        ctx.strokeText(pct,lx,ly-6);ctx.fillText(pct,lx,ly-6);
        ctx.font='9px Malgun Gothic';
        ctx.strokeText(label,lx,ly+8);ctx.fillText(label,lx,ly+8);
      });
      ctx.restore();
    }
  };

  // 외부 툴팁: 기본 툴팁이 도넛 아래 요약카드와 겹치는 문제 해결 —
  // 커서 기준 오른쪽, 차트 카드 맨 위에 고정 표시
  const donutExternalTooltip=(context)=>{
    const {chart,tooltip}=context;
    let el=document.getElementById('donutTooltip');
    if(!el){
      el=document.createElement('div');
      el.id='donutTooltip';
      el.style.cssText='position:fixed;z-index:9999;pointer-events:none;background:#2C2C2C;color:#fff;'
        +'padding:6px 10px;border-radius:6px;font-size:11px;white-space:nowrap;'
        +'box-shadow:0 3px 10px rgba(0,0,0,0.3);opacity:0;transition:opacity .08s;';
      document.body.appendChild(el);
    }
    if(tooltip.opacity===0){el.style.opacity=0;return;}
    if(tooltip.body){
      el.innerHTML=tooltip.body.map(b=>b.lines.join('<br>')).join('<br>');
    }
    const rect=chart.canvas.getBoundingClientRect();
    el.style.left=(rect.left+tooltip.caretX+16)+'px'; // 커서 기준 우측
    el.style.top=(rect.top+4)+'px'; // 카드 맨 위 고정 — 아래 데이터에 가려지지 않게
    el.style.opacity=1;
  };

  ['oyDonut','jsDonut'].forEach((id,ci)=>{
    const el=document.getElementById(id);if(!el)return;
    if(charts[id]){try{charts[id].destroy();}catch(e){}delete charts[id];}
    const prev=Chart.getChart(el); if(prev){try{prev.destroy();}catch(e){}}
    const rows=ci===0?oyRows:jsRows;
    const data=PROD_KEYS.map(k=>rows.reduce((t,r)=>t+(r[k]||0),0));
    const total=data.reduce((a,b)=>a+b,0);
    if(total===0)return;
    charts[id]=newChart(el,{type:'doughnut',data:{
      labels:PROD_LABELS,
      datasets:[{data,backgroundColor:PROD_COLORS,borderWidth:2,borderColor:'#fff'}]
    },options:{responsive:true,maintainAspectRatio:false,
      plugins:{legend:{position:'right',labels:{font:{size:10},boxWidth:12}},
        tooltip:{enabled:false,external:donutExternalTooltip,callbacks:{label:i=>`${i.label}: ${(i.raw/total*100).toFixed(1)}% (실매출 ${Math.round(i.raw).toLocaleString()}원)`}}}},
      plugins:[topSliceLabels]});
  });

  // BEP 기준선(점선) — 통합 B-ROAS가 손익분기 대비 초과/미달인지 한눈에 보이도록
  const intBepLine=(bepVal,color=LINE_COLORS.bep)=>({
    id:'intBepLine',
    afterDraw(chart){
      const {ctx,scales:{y2}}=chart;
      if(!y2)return;
      const y=y2.getPixelForValue(bepVal);
      const {left,right}=chart.chartArea;
      ctx.save();ctx.strokeStyle=color;ctx.lineWidth=1.5;ctx.setLineDash([6,3]);
      ctx.beginPath();ctx.moveTo(left,y);ctx.lineTo(right,y);ctx.stroke();
      ctx.fillStyle=color;ctx.font='bold 9px Malgun Gothic';ctx.textAlign='right';
      ctx.fillText('BEP '+bepVal+'%',right-4,y-4);ctx.restore();
    }
  });

  ['oyIntChart','jsIntChart'].forEach(id=>{
    const el=document.getElementById(id);
    if(!el)return;
    if(charts[id]){try{charts[id].destroy();}catch(e){}delete charts[id];}
    const prev=Chart.getChart(el); if(prev){try{prev.destroy();}catch(e){}}
    const isOy=id.startsWith('oy');
    const rows=isOy?oyRows:jsRows;
    if(!rows.length)return;
    const labels=rows.map(r=>r.key);

    const bar1 = isOy
      ? {label:'온라인 매출',data:rows.map(r=>Math.round((r.online||0)/1e4)),backgroundColor:'rgba(184,134,11,0.7)',borderColor:'#B8860B',borderWidth:1,borderRadius:3,yAxisID:'y'}
      : {label:'전체 매출',data:rows.map(r=>Math.round((r.total||0)/1e4)),backgroundColor:TOTAL_COLOR,borderColor:TOTAL_COLOR,borderWidth:1,borderRadius:3,yAxisID:'y'};
    const bar2 = {label:'광고 전환 매출',data:rows.map(r=>Math.round((r.adSales||0)/1e4)),backgroundColor:CHARCOAL,borderColor:CHARCOAL,borderWidth:1,borderRadius:3,yAxisID:'y'};
    const lineData = rows.map(r=>r.adSpend>0&&r.online>0?Math.round(r.online/r.adSpend*100):null);
    const bepVal = isOy ? BEP.oy : BEP.js;

    charts[id]=newChart(el,{type:'bar',data:{labels,datasets:[
      bar1, bar2,
      {label:'B-ROAS',data:lineData,
        type:'line',borderColor:LINE_COLORS.broas,backgroundColor:'transparent',borderWidth:2,borderDash:[5,3],pointRadius:3,pointBackgroundColor:LINE_COLORS.broas,tension:0.3,spanGaps:true,yAxisID:'y2'},
    ]},options:{responsive:true,maintainAspectRatio:false,
      plugins:{legend:{display:false},tooltip:{callbacks:{label:i=>i.dataset.yAxisID==='y2'?`B-ROAS: ${i.raw}%`:`${i.dataset.label}: ${i.raw.toLocaleString()}만원`}}},
      scales:{
        x:{ticks:{font:{size:9},maxRotation:45,autoSkip:true}},
        y:{type:'linear',position:'left',ticks:{font:{size:9},callback:v=>v.toLocaleString()+'만'}},
        y2:{type:'linear',position:'right',grid:{drawOnChartArea:false},ticks:{font:{size:9},callback:v=>v+'%'}},
      },
      plugins:[intBepLine(bepVal),llpFn(2,LINE_COLORS.broas,v=>v+'%')]}});
  });
}

/* ── 데이터 집계 ── */
function merge(ch){
  const sales=DATA[ch].sales, paid=DATA[ch].paid;
  const m={};
  sales.forEach(r=>{const k=localISO(r.date);m[k]={...(m[k]||{}),...r};});
  paid.forEach(r=>{const k=localISO(r.date);m[k]={...(m[k]||{date:r.date}),...r};});
  return Object.values(m).sort((a,b)=>new Date(a.date)-new Date(b.date));
}

function groupBy(rows,keyFn){
  const m={};
  rows.forEach(r=>{const k=keyFn(new Date(r.date));(m[k]=m[k]||[]).push(r);});
  return Object.entries(m).map(([key,arr])=>{
    const s=f=>arr.reduce((t,r)=>t+(r[f]||0),0);
    const vis=s('visitors'), pur=s('purchases');
    return {key,date:arr[0].date,
      total:s('total'),online:s('online'),masca:s('masca'),nose:s('nose'),milk:s('milk'),
      lip:s('lip'),spx:s('spx'),matcha:s('matcha'),
      visitors:vis,purchases:pur,
      cvRate:vis>0?Math.round(pur/vis*1000)/10:0,

// toISOString()은 항상 UTC로 변환하는데, 한국(UTC+9)처럼 UTC보다 앞선 시간대에서는
// 로컬 자정이 UTC로 전날 오후가 되어 날짜가 하루 당겨지는 버그가 생긴다.
// 날짜 키·라벨 생성은 전부 이 함수로 통일 — 로컬 캘린더 날짜를 그대로 문자열화(UTC 변환 없음).
const localISO=(d)=>{
  const t=(d instanceof Date)?d:new Date(d);
  return `${t.getFullYear()}-${String(t.getMonth()+1).padStart(2,'0')}-${String(t.getDate()).padStart(2,'0')}`;
};

const weekStart=d=>{const t=new Date(d);t.setDate(t.getDate()-((t.getDay()+6)%7));return localISO(t);};
const monthKey=d=>{const t=new Date(d);return `${t.getFullYear()}-${String(t.getMonth()+1).padStart(2,'0')}`;};

function derived(rows){
  return rows.map(r=>({...r,
    onlineRatio:r.total>0&&r.online>0?r.online/r.total:null,
    adDep:r.online>0?r.adSales/r.online:null,
    adRate:r.online>0?r.adSpend/r.online:null,
    bRoas:r.adSpend>0&&r.online>0?r.online/r.adSpend:null,
    totalRoas:r.adSpend>0?r.adSales/r.adSpend:null,
    metaRoas:r.metaSpend>0?r.metaSales/r.metaSpend:null,
    cpcRoas:r.cpcSpend>0?r.cpcSales/r.cpcSpend:null,
    matchaRoas:r.matchaSpend>0?(r.matchaCV||0)/r.matchaSpend:null,
    matchaMetaRoas:r.matchaMetaSpend>0?(r.matchaMetaCV||0)/r.matchaMetaSpend:null,
    matchaCpcRoas:r.matchaCpcSpend>0?(r.matchaCpcCV||0)/r.matchaCpcSpend:null,
    mascaRoas:r.mascaSpend>0?r.mascaCV/r.mascaSpend:null,
    mascaMetaRoas:r.mascaMetaSpend>0?r.mascaMetaCV/r.mascaMetaSpend:null,
    mascaCpcRoas:r.mascaCpcSpend>0?r.mascaCpcCV/r.mascaCpcSpend:null,
    noseRoas:r.noseSpend>0?r.noseCV/r.noseSpend:null,
    noseMetaRoas:r.noseMetaSpend>0?r.noseMetaCV/r.noseMetaSpend:null,
    noseCpcRoas:r.noseCpcSpend>0?r.noseCpcCV/r.noseCpcSpend:null,
    milkRoas:r.milkSpend>0?r.milkCV/r.milkSpend:null,
    milkMetaRoas:r.milkMetaSpend>0?r.milkMetaCV/r.milkMetaSpend:null,
    milkCpcRoas:r.milkCpcSpend>0?r.milkCpcCV/r.milkCpcSpend:null,
    spxRoas:r.spxSpend>0?r.spxCV/r.spxSpend:null,
    spxMetaRoas:r.spxMetaSpend>0?r.spxMetaCV/r.spxMetaSpend:null,
    spxCpcRoas:r.spxCpcSpend>0?r.spxCpcCV/r.spxCpcSpend:null,
  }));
}

function getRows(ch,tab,rangeKey){
  let all=merge(ch);
  const rk=rangeKey||ch;
  const ds=drStart[rk], de=drEnd[rk];
  if(ds||de){
    all=all.filter(r=>{
      const t=new Date(r.date).getTime();
      if(ds&&t<ds.getTime())return false;
      if(de&&t>de.getTime())return false;
      return true;
    });
  }
  if(tab==='daily') return derived(all.map(r=>({...r,key:localISO(r.date)})));
  if(tab==='weekly') return derived(groupBy(all,d=>weekStart(d)).map(r=>({...r,key:r.key+'~'})));
  return derived(groupBy(all,d=>monthKey(d)));
}

function setProd(ch,group,key,el){
  curProd[ch][group]=key;
  el.parentElement.querySelectorAll('.pfil,.ctgl').forEach(b=>b.classList.remove('active'));
  el.classList.add('active');
  const rows=getRows(ch,curTab[ch]).filter(r=>(r.total||0)>0||(r.adSpend||0)>0);

  const R=rows.slice(-n);
  const labels=R.map(r=>curTab[ch]==='monthly'?r.key:r.key.slice(5));

/* ── 자사몰 트래픽 이슈 기록 (브라우저 localStorage 저장 — 팀 공유 아님) ── */
/* ── 자사몰 트래픽 이슈 기록 (Supabase 공유 테이블 — 팀원 전체가 동일하게 봄) ── */
let jsIssuesCache=[];

async function refreshJsIssuesCache(){
  try{
    const {data,error}=await sb.from('js_traffic_issues').select('*').order('start_date',{ascending:true});
    if(error)throw error;
    jsIssuesCache=(data||[]).map(x=>({id:x.id,start:x.start_date,end:x.end_date,text:x.text,link:x.link}));
  }catch(e){
    console.warn('이슈 목록 조회 실패 — Supabase에 js_traffic_issues 테이블이 있는지 확인하세요.',e);
  }
  return jsIssuesCache;
}
function getJsIssues(){ return jsIssuesCache; }
async function addJsIssue(){
  const start=document.getElementById('issueStart')?.value;
  const endEl=document.getElementById('issueEnd');
  const end=endEl?.value || start;
  const text=document.getElementById('issueText')?.value?.trim();
  const link=document.getElementById('issueLink')?.value?.trim();
  if(!start||!text){ alert('시작일과 내용은 필수입니다.'); return; }
  const {error}=await sb.from('js_traffic_issues').insert({
    start_date:start, end_date:end, text, link:link||null, created_by:currentUser?.email||null
  });
  if(error){ alert('저장 실패: '+error.message); return; }
  document.getElementById('issueStart').value='';
  document.getElementById('issueEnd').value='';
  document.getElementById('issueText').value='';
  document.getElementById('issueLink').value='';
  await refreshJsIssuesCache();
  renderJsIssuePanel();
  rerenderJsTrafficOnly();
}
async function removeJsIssue(id){
  const {error}=await sb.from('js_traffic_issues').delete().eq('id',id);
  if(error){ alert('삭제 실패: '+error.message); return; }
  await refreshJsIssuesCache();
  renderJsIssuePanel();
  rerenderJsTrafficOnly();
}
function renderJsIssuePanel(){
  const el=document.getElementById('issueList');
  if(!el)return;
  const arr=getJsIssues();
  if(!arr.length){ el.innerHTML='<div style="font-size:11px;color:#bbb">등록된 이슈가 없습니다</div>'; return; }
  el.innerHTML=arr.map(x=>`
    <div class="issue-item">
      <span class="issue-date">${x.start}${x.end&&x.end!==x.start?' ~ '+x.end:''}</span>
      <span class="issue-body">${x.text}${x.link?` — <a href="${x.link}" target="_blank" rel="noopener">링크</a>`:''}</span>
      <span class="issue-del" onclick="removeJsIssue(${x.id})">✕</span>

}

/* ── 차트 렌더 ── */
const llpFn=(dsIdx,color,fmtFn=v=>v+'%')=>({
  id:'llp'+dsIdx+Math.random(),
  afterDatasetsDraw(chart){
    const {ctx}=chart;
    const meta=chart.getDatasetMeta(dsIdx);
    if(!meta||meta.hidden)return;
    meta.data.forEach((pt,i)=>{
      const val=chart.data.datasets[dsIdx].data[i];
      if(val==null||isNaN(val))return;
      ctx.save();ctx.font='bold 9px Malgun Gothic';ctx.fillStyle=color;
      ctx.textAlign='center';ctx.fillText(fmtFn(val),pt.x,pt.y-6);ctx.restore();
    });
  }
});

function renderJsTrafficChart(R,labels){
  const id='js_traffic';
  const el=document.getElementById(id);if(!el)return;
  if(charts[id]){try{charts[id].destroy();}catch(e){}}

  // 이슈 구간 음영 — 등록된 이슈의 날짜 범위와 겹치는 막대 구간을 회색으로 표시
  const issues=getJsIssues();
  const issueShade={
    id:'issueShade',
    beforeDatasetsDraw(chart){
      if(!issues.length)return;
      const {ctx,chartArea,scales:{x}}=chart;
      const dateKeys=R.map(r=>localISO(r.date));
      ctx.save();
      issues.forEach(iss=>{
        let i0=dateKeys.findIndex(d=>d>=iss.start);
        let i1=dateKeys.length-1;
        for(let i=dateKeys.length-1;i>=0;i--){ if(dateKeys[i]<=iss.end){i1=i;break;} }
        if(i0<0||i1<i0)return;
        const xw=x.width/dateKeys.length;
        const px0=x.getPixelForValue(i0)-xw/2;
        const px1=x.getPixelForValue(i1)+xw/2;
        ctx.fillStyle='rgba(160,160,160,0.18)';
        ctx.fillRect(Math.max(px0,chartArea.left),chartArea.top,Math.min(px1,chartArea.right)-Math.max(px0,chartArea.left),chartArea.height);
      });
      ctx.restore();
    }
  };

  charts[id]=newChart(el,{type:'bar',data:{labels,datasets:[
    {label:'유입자수',data:R.map(r=>r.visitors||0),backgroundColor:'rgba(184,134,11,0.5)',borderColor:'#B8860B',borderWidth:1,borderRadius:3,yAxisID:'y'},
    {label:'구매건수',data:R.map(r=>r.purchases||0),backgroundColor:'rgba(44,44,44,0.7)',borderColor:'#2C2C2C',borderWidth:1,borderRadius:3,yAxisID:'y'},
    {label:'전환율',data:R.map(r=>r.cvRate||null),type:'line',borderColor:LINE_COLORS.broas,backgroundColor:'transparent',borderWidth:2,pointRadius:3,pointBackgroundColor:LINE_COLORS.broas,tension:0.3,spanGaps:true,yAxisID:'y2'},
  ]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},
    tooltip:{callbacks:{label:i=>i.dataset.yAxisID==='y2'?`전환율: ${i.raw}%`:`${i.dataset.label}: ${i.raw?.toLocaleString()}`}}},
    scales:{x:{ticks:{font:{size:9},maxRotation:45,autoSkip:true}},
      y:{type:'linear',position:'left',ticks:{font:{size:9},callback:v=>v.toLocaleString()}},
      y2:{type:'linear',position:'right',grid:{drawOnChartArea:false},ticks:{font:{size:9},callback:v=>v+'%'}}}},

function render12(ch,R,labels,avgRatio){
  const id=`${ch}_c12`;if(charts[id]){try{charts[id].destroy();}catch(e){}}
  const el=document.getElementById(id);if(!el)return;
  const key=curProd[ch].p12;
  const isAll=key==='all';
  const isCombined = ch==='oy' && curProd[ch].c12Basis==='combined';

  // 전체(온라인): I열 온라인 주문금(실측) ÷ 광고지출 / 전체(통합): 전체 매출(J열, 실측) ÷ 광고지출
  // 품목별(온라인): 시트에 품목별 온라인 매출이 없어 추정 — 기간 평균 온라인비중 적용
  // 품목별(통합): 품목 전체 매출을 그대로 사용 — 온라인/오프라인 분해가 필요 없어 추정 없이 실측
  const cvData = isAll
    ? R.map(r=>Math.round((r.adSales||0)/1e4))
    : R.map(r=>Math.round((r[key+'CV']||0)/1e4));
  const broasData = isAll
    ? R.map(r=>{
        if(r.adSpend<=0)return null;
        const basis = isCombined ? r.total : r.online;
        return basis>0?Math.round(basis/r.adSpend*100):null;
      })
    : R.map(r=>{
        const sp=r[key+'Spend']||0, rev=r[key]||0;
        if(sp<=0||rev<=0)return null;
        if(isCombined) return Math.round(rev/sp*100); // 품목 전체 매출 그대로 — 실측
        return avgRatio>0 ? Math.round(rev*avgRatio/sp*100) : null; // 온라인 추정
      });

  const bepPlugins=[llpFn(1,LINE_COLORS.broas)];
  {
    const bepChannel = ch==='js' ? BEP.js : BEP.oy;
    const bepVal = isAll ? bepChannel : (BEP_PROD[ch]?.[key] ?? bepChannel);
    bepPlugins.push({
      id:'bepLine',
      afterDraw(chart){
        const {ctx,scales:{y2}}=chart;
        if(!y2)return;
        const y=y2.getPixelForValue(bepVal);
        const {left,right}=chart.chartArea;
        ctx.save();ctx.strokeStyle=LINE_COLORS.bep;ctx.lineWidth=1.5;ctx.setLineDash([6,3]);
        ctx.beginPath();ctx.moveTo(left,y);ctx.lineTo(right,y);ctx.stroke();
        ctx.fillStyle=LINE_COLORS.bep;ctx.font='bold 9px Malgun Gothic';ctx.textAlign='right';
        ctx.fillText('BEP '+bepVal+'%',right-4,y-4);ctx.restore();
      }
    });
  }

  const barColor = isAll ? TOTAL_COLOR : PM(key).color;
  const broasLabel = isCombined ? 'B-ROAS(통합)' : (isAll?'B-ROAS':'B-ROAS(추정)');
  charts[id]=newChart(el,{type:'bar',data:{labels,datasets:[
    {label:'광고 전환매출',data:cvData,backgroundColor:barColor,borderColor:barColor,borderWidth:1,borderRadius:3,yAxisID:'y'},
    {label:broasLabel,data:broasData,type:'line',borderColor:LINE_COLORS.broas,backgroundColor:'transparent',borderWidth:2,borderDash:[5,3],pointRadius:3,pointBackgroundColor:LINE_COLORS.broas,tension:0.3,spanGaps:true,yAxisID:'y2'},
  ]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},
    tooltip:{callbacks:{label:i=>i.datasetIndex===1?`${i.dataset.label}: ${i.raw}%`:`${i.dataset.label}: ${i.raw?.toLocaleString()}만원`}}},
  scales:{
    x:{ticks:{font:{size:9},maxRotation:45,autoSkip:true}},
    y:{type:'linear',position:'left',ticks:{font:{size:9},callback:v=>v.toLocaleString()+'만'}},
    y2:{type:'linear',position:'right',grid:{drawOnChartArea:false},ticks:{font:{size:9},callback:v=>v+'%'}},
  }},
  plugins:bepPlugins});
}

/* ── 진단: OY 품목별 광고 열 매핑 정합성 검증 ──
   사용법: verifyOy()
   품목별 합계가 전체값과 일치하는지 전 기간 대조. 열이 밀리면 즉시 드러남 */
window.verifyOy = function(){
  const rows=DATA.oy.paid;
  if(!rows.length){console.warn('데이터 없음');return;}
  const P=['masca','nose','milk','spx','matcha','lip'];
  const bad=[];
  rows.forEach(r=>{
    const sumSpend=P.reduce((a,k)=>a+(r[k+'Spend']||0),0);
    const sumCV=P.reduce((a,k)=>a+(r[k+'CV']||0),0);
    // 기타·헤어미스트는 품목 목록에 없으므로 품목합 <= 전체 여야 함
    const d1=sumSpend-(r.adSpend||0), d2=sumCV-(r.adSales||0);
    if(d1>1||d2>1)bad.push({날짜:localISO(r.date),
      품목지출합:Math.round(sumSpend),전체지출:Math.round(r.adSpend),
      품목전환합:Math.round(sumCV),전체전환:Math.round(r.adSales)});
  });
  if(bad.length){
    console.warn(`⚠️ 품목합이 전체를 초과한 날 ${bad.length}일 — 열 매핑 의심`);
    console.table(bad.slice(0,20));
  } else {
    console.log(`✅ ${rows.length}일 전체 정합성 이상 없음 (품목합 ≤ 전체)`);
  }
  const cov=P.map(k=>({품목:k, 지출있는날:rows.filter(r=>(r[k+'Spend']||0)>0).length,
    전환있는날:rows.filter(r=>(r[k+'CV']||0)>0).length}));
  console.table(cov);
  return {bad,cov};
};

/* ── 진단: 특정 날짜의 원본 시트 행 확인 ──
   사용법: dumpRow('oyDaily','2026-07-26')   ('oyDaily' | 'oyPaid' | 'js')
   해당 날짜 전후 행의 원본 값을 가공 없이 출력 — 빈칸/#N/A/#REF! 구분 가능 */
window.dumpRow = function(which='oyDaily', dateStr, span=3){
  const raw=(window.RAW||{})[which];
  if(!raw){console.warn('RAW 없음 — 먼저 "Sheets에서 자동 불러오기" 실행');return;}
  const dcol = which==='js'?3:4;
  const norm=v=>{const m=String(v??'').match(/(\d{2,4})[.\-\/\s]+(\d{1,2})[.\-\/\s]+(\d{1,2})/);
    if(!m)return null;let y=+m[1];if(y<100)y+=2000;
    return `${y}-${String(+m[2]).padStart(2,'0')}-${String(+m[3]).padStart(2,'0')}`;};
  const idx=raw.findIndex(r=>norm(r?.[dcol])===dateStr);
  if(idx<0){console.warn(dateStr+' 행을 못 찾음');return;}
  const cols = which==='js'
    ? [{i:3,n:'날짜'},{i:5,n:'방문자'},{i:6,n:'구매건수'},{i:8,n:'전체매출'},{i:9,n:'자사몰매출'},{i:32,n:'전체지출'},{i:34,n:'메타지출'},{i:47,n:'메타전환'}]
    : which==='oyDaily'
      ? [{i:4,n:'날짜'},{i:9,n:'전체매출(J)'},{i:10,n:'온라인매출(K)'},{i:11,n:'L'},{i:12,n:'M'}]
      : [{i:4,n:'날짜'},{i:6,n:'전환매출'},{i:7,n:'META전환'},{i:8,n:'CPC전환'},{i:9,n:'광고지출'},{i:10,n:'META지출'},{i:11,n:'CPC지출'}];
  const out=[];
  for(let i=Math.max(0,idx-span);i<=Math.min(raw.length-1,idx+span);i++){
    const o={행:i};
    cols.forEach(c=>{const v=raw[i]?.[c.i];
      o[c.n]= v===undefined?'(undefined)' : v==='' ? '(빈칸)' : v;});
    out.push(o);
  }
  console.log(`[${which}] ${dateStr} = ${idx}행 (0-based) 기준 ±${span}행`);
  console.table(out);
  return out;
};

/* ── 진단: 월별 매출·온라인 실측 ──
   사용법: 콘솔에서  dumpMonthly('oy')   ('oy' | 'js')
   파싱된 값과 원본 시트 값을 나란히 비교해 어디서 0이 되는지 확인 */
window.dumpMonthly = function(ch='oy'){
  const rows=getRows(ch,'monthly');
  console.log(`[${ch}] 파싱 결과 — 원본 sales ${DATA[ch].sales.length}행 / paid ${DATA[ch].paid.length}행`);
  console.table(rows.map(r=>({
    월:r.key, 전체매출:Math.round(r.total), 온라인매출:Math.round(r.online),
    온라인비중:r.total>0?(r.online/r.total*100).toFixed(1)+'%':'-',
    광고지출:Math.round(r.adSpend), 전환매출:Math.round(r.adSales),
  })));
  // 원본 일별에서 online=0 인 날 카운트
  const bad=DATA[ch].sales.filter(r=>(r.total||0)>0&&(r.online||0)===0);
  console.log(`전체매출>0 이면서 온라인매출=0 인 날: ${bad.length}일`);
  if(bad.length){
    console.log('해당 날짜 샘플:', bad.slice(0,15).map(r=>localISO(r.date)).join(', '));
  }
  return rows;
};

/* ── 진단: 시트 열 실측용 ──
   사용법: 콘솔에서  dumpCols('oyPaid')   ('oyDaily' | 'oyPaid' | 'js')
   헤더 후보 3행과 값이 있는 샘플 데이터 행을 열 인덱스와 함께 출력 */
window.dumpCols = function(which='oyPaid', sampleRow){
  const raw = (window.RAW||{})[which];
  if(!raw){console.warn('RAW 없음 — 먼저 "Sheets에서 자동 불러오기" 실행');return;}
  console.log(`[${which}] 총 ${raw.length}행 / 최대 ${Math.max(...raw.slice(0,10).map(r=>r?.length||0))}열`);
  const si = sampleRow ?? raw.findIndex((r,i)=>i>2 && r && r.filter(v=>v!=='' && v!=null).length>15);
  const width = Math.max(...raw.slice(0,Math.max(si+1,6)).map(r=>r?.length||0));
  const out=[];
  for(let c=0;c<width;c++){
    out.push({
      idx:c,
      col:(c<26?String.fromCharCode(65+c):String.fromCharCode(64+Math.floor(c/26))+String.fromCharCode(65+c%26)),
      h0:raw[0]?.[c]??'', h1:raw[1]?.[c]??'', h2:raw[2]?.[c]??'',
      sample:raw[si]?.[c]??''
    });
  }
  console.log(`샘플 데이터 행 = ${si}행(0-based)`);
  console.table(out);
  return out;
};

/* ── 초기화 ── */
sb.auth.onAuthStateChange((event,session)=>{
  if(event==='SIGNED_IN'&&session){checkAuth();}
  else if(event==='SIGNED_OUT'){showLogin();}
});

checkAuth();
